name: sismowatch

x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  image: sismowatch-airflow:latest
  user: "${AIRFLOW_UID:-1000}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-admin123}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-ZgeAgRZYfvYbs3ipZofrTGlVdAS4dO1nIThODwq_-jM=}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-k8A9Z1mX0vB4nQ7wE2rT5yU8iO1pA3sD}
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: ""
    _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-sismo_admin}
    _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-admin123}
    _AIRFLOW_WWW_USER_FIRSTNAME: ${_AIRFLOW_WWW_USER_FIRSTNAME:-Sismo}
    _AIRFLOW_WWW_USER_LASTNAME: ${_AIRFLOW_WWW_USER_LASTNAME:-Admin}
    _AIRFLOW_WWW_USER_EMAIL: ${_AIRFLOW_WWW_USER_EMAIL:-admin@sismowatch.internal}
    # Database connections for SismoWatch pipelines
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: sismowatch
    DB_INGEST_USER: ${DB_INGEST_USER:-sismo_ingest}
    DB_INGEST_PASSWORD: ${DB_INGEST_PASSWORD:-admin123}
    DB_TRANSFORM_USER: ${DB_TRANSFORM_USER:-sismo_transform}
    DB_TRANSFORM_PASSWORD: ${DB_TRANSFORM_PASSWORD:-admin123}
    DB_READONLY_USER: ${DB_READONLY_USER:-sismo_readonly}
    DB_READONLY_PASSWORD: ${DB_READONLY_PASSWORD:-admin123}
    AI_PROVIDER: ${AI_PROVIDER:-groq}
    GROQ_API_KEY: ${GROQ_API_KEY:-}
    GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    USGS_API_URL: ${USGS_API_URL:-https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_hour.geojson}
    USGS_HISTORICAL_URL: ${USGS_HISTORICAL_URL:-https://earthquake.usgs.gov/fdsnws/event/1/query}
    PYTHONPATH: /opt/airflow:/opt/airflow/include
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/include:/opt/airflow/include
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/tests:/opt/airflow/tests

services:
  postgres:
    image: postgres:16
    container_name: sismowatch-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  airflow-init:
    <<: *airflow-common
    container_name: sismowatch-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        echo "Running Airflow database migrations..."
        airflow db migrate
        echo "Creating admin user '${_AIRFLOW_WWW_USER_USERNAME}'..."
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME}" \
          --firstname "${_AIRFLOW_WWW_USER_FIRSTNAME}" \
          --lastname "${_AIRFLOW_WWW_USER_LASTNAME}" \
          --role Admin \
          --email "${_AIRFLOW_WWW_USER_EMAIL}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD}" || true
        echo "Airflow initialization complete!"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: sismowatch-airflow-webserver
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 6
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    container_name: sismowatch-airflow-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 10s
      timeout: 10s
      retries: 6
    restart: always

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: sismowatch-api:latest
    container_name: sismowatch-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: sismowatch
      DB_READONLY_USER: ${DB_READONLY_USER:-sismo_readonly}
      DB_READONLY_PASSWORD: ${DB_READONLY_PASSWORD:-admin123}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-f98124b89c372f61e87a2bd01948ce6529ab7801df0498b584a6c0291d90472e}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      PLATFORM_ADMIN_USER: ${PLATFORM_ADMIN_USER:-admin}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-admin123}
      PLATFORM_VIEWER_USER: ${PLATFORM_VIEWER_USER:-viewer}
      PLATFORM_VIEWER_PASSWORD: ${PLATFORM_VIEWER_PASSWORD:-admin123}
      AIRFLOW_BASE_URL: http://airflow-webserver:8080
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-sismo_admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-admin123}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: sismowatch-web:latest
    container_name: sismowatch-web
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: always

volumes:
  postgres_data:
